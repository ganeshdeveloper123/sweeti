<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWEETY 💖</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:white;
    background:
        radial-gradient(circle at top,#32105c,#120021 55%,#05000d);
}

#stars{
    position:fixed;
    inset:0;
    z-index:0;
}

.container{
    position:relative;
    z-index:3;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.card{
    width:min(500px,95vw);
    max-height:92vh;
    overflow:auto;
    padding:30px 20px;
    text-align:center;
    border-radius:30px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
    backdrop-filter:blur(12px);
    box-shadow:0 0 50px rgba(255,0,180,.25);
}

h1{
    font-size:42px;
    color:#ff8bdc;
    text-shadow:
        0 0 10px #ff1493,
        0 0 25px #ff1493,
        0 0 45px #ff1493;
    animation:heartbeat 1.5s infinite;
    margin-bottom:10px;
}

.subtitle{
    color:#ffd6f4;
    font-size:15px;
    margin-bottom:25px;
}

.gift-area{
    perspective:800px;
    margin:30px auto;
}

.gift{
    width:150px;
    height:120px;
    margin:auto;
    position:relative;
    cursor:pointer;
    animation:giftFloat 2.5s ease-in-out infinite;
}

.box{
    position:absolute;
    bottom:0;
    width:150px;
    height:100px;
    border-radius:8px;
    background:linear-gradient(135deg,#ff3d9a,#8b2cff);
    box-shadow:
        0 0 20px #ff1493,
        0 0 50px rgba(255,20,147,.4);
}

.ribbon-v{
    position:absolute;
    left:63px;
    width:24px;
    height:100%;
    background:#ffd75a;
}

.ribbon-h{
    position:absolute;
    top:38px;
    width:100%;
    height:22px;
    background:#ffd75a;
}

.lid{
    position:absolute;
    top:0;
    left:0;
    width:150px;
    height:35px;
    border-radius:8px;
    background:linear-gradient(135deg,#ff69b4,#9c27ff);
    transform-origin:bottom center;
    transition:1s ease;
    z-index:5;
}

.gift.open .lid{
    transform:rotateX(115deg) translateY(-10px) translateZ(10px);
}

.bow{
    position:absolute;
    top:-15px;
    left:60px;
    width:30px;
    height:30px;
    z-index:8;
}

.bow:before,
.bow:after{
    content:"";
    position:absolute;
    width:30px;
    height:25px;
    background:#ffd75a;
    border-radius:50% 50% 10% 50%;
}

.bow:before{
    transform:rotate(35deg);
}

.bow:after{
    transform:rotate(-35deg);
}

.secret{
    display:none;
    margin:25px auto;
    padding:22px;
    border-radius:20px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,150,220,.3);
    color:#ffe5f7;
}

.secret.show{
    display:block;
    animation:messageReveal 1.5s ease;
}

#typingMessage{
    white-space:pre-line;
    text-align:center;
    line-height:1.8;
    min-height:280px;
}

.cursor{
    color:#ff8bdc;
    font-weight:bold;
    animation:blink .7s infinite;
}

.highlight{
    color:#ff8bdc;
    font-size:23px;
    font-weight:bold;
    text-shadow:
        0 0 10px #ff1493,
        0 0 25px #ff1493;
}

button{
    display:none;
    margin:20px auto 0;
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:linear-gradient(45deg,#ff1493,#9c27ff);
    color:white;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 0 20px rgba(255,20,147,.5);
}

button.show{
    display:block;
}

.rose{
    position:fixed;
    top:-50px;
    font-size:25px;
    animation:fall linear forwards;
    z-index:2;
    pointer-events:none;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(360deg);
    }
}

@keyframes giftFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
}

@keyframes heartbeat{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.06);}
}

@keyframes messageReveal{
    from{
        opacity:0;
        transform:translateY(25px) scale(.9);
        filter:blur(10px);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
        filter:blur(0);
    }
}

@keyframes blink{
    0%,50%{opacity:1;}
    51%,100%{opacity:0;}
}

@keyframes heartFly{
    to{
        transform:
            translate(var(--x),var(--y))
            rotate(360deg)
            scale(.2);
        opacity:0;
    }
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="container">
<div class="card">

<h1>SWEETY 💖</h1>

<div class="subtitle">

</div>

<div class="gift-area">
<div class="gift" id="gift" onclick="openGift()">

<div class="lid"></div>

<div class="box">
<div class="ribbon-v"></div>
<div class="ribbon-h"></div>
</div>

<div class="bow"></div>

</div>
</div>

<div id="instruction">
🎁 Tap the gift, SWEETY...
</div>

<div class="secret" id="secret">
<div id="typingMessage"></div>
</div>

<button id="again" onclick="location.reload()">
💝 Open Again
</button>

</div>
</div>

<script>

/* STAR BACKGROUND */

const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");

function resizeCanvas(){
    canvas.width=window.innerWidth;
    canvas.height=window.innerHeight;
}

resizeCanvas();
window.addEventListener("resize",resizeCanvas);

let stars=[];

for(let i=0;i<180;i++){
    stars.push({
        x:Math.random()*window.innerWidth,
        y:Math.random()*window.innerHeight,
        r:Math.random()*1.5,
        speed:Math.random()*.3+.1
    });
}

function drawStars(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle="white";

    stars.forEach(s=>{

        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            s.r,
            0,
            Math.PI*2
        );

        ctx.fill();

        s.y+=s.speed;

        if(s.y>canvas.height){
            s.y=0;
        }

    });

    requestAnimationFrame(drawStars);
}

drawStars();


/* FALLING FLOWERS */

function createRose(){

    const rose=document.createElement("div");

    rose.className="rose";

    rose.innerHTML=
        Math.random()>.5 ? "✨" : "🌸";

    rose.style.left=
        Math.random()*100+"vw";

    rose.style.animationDuration=
        (5+Math.random()*6)+"s";

    rose.style.fontSize=
        (18+Math.random()*20)+"px";

    document.body.appendChild(rose);

    setTimeout(()=>{
        rose.remove();
    },12000);
}

setInterval(createRose,700);


/* MESSAGE */

const message=`Hey SWEETY... 💗

I just wanted to tell you something...

I've been missing you.
Missing your messages,
your smile,
and our little conversations. 🥺🌙

I MISS YOU, SWEETY ❤️

I'm not to say anything more than that...

I'm just missing you.
BYE Sweetyy take care Happy ga undu 🥺💗

No pressure, no expectations...
I just wanted you to know. 🌹`;

let charIndex=0;


/* TYPEWRITER */

function typeMessage(){

    const box=
        document.getElementById("typingMessage");

    if(charIndex<message.length){

        box.innerHTML=
            message.substring(0,charIndex+1)
            +
            '<span class="cursor">|</span>';

        charIndex++;

        setTimeout(typeMessage,45);

    }else{

        box.innerHTML=message;

    }
}


/* OPEN GIFT */

function openGift(){

    const gift=
        document.getElementById("gift");

    if(gift.classList.contains("open")){
        return;
    }

    gift.classList.add("open");

    heartExplosion();

    setTimeout(()=>{

        document.getElementById("instruction")
            .style.display="none";

        document.getElementById("secret")
            .classList.add("show");

        document.getElementById("again")
            .classList.add("show");

        charIndex=0;

        document.getElementById("typingMessage")
            .innerHTML="";

        typeMessage();

    },900);
}


/* HEART EXPLOSION */

function heartExplosion(){

    for(let i=0;i<40;i++){

        const heart=document.createElement("div");

        heart.innerHTML=
            Math.random()>.5
            ? "❤️"
            : "💖";

        heart.style.position="fixed";
        heart.style.left="50%";
        heart.style.top="45%";
        heart.style.fontSize=
            (15+Math.random()*25)+"px";

        heart.style.zIndex="20";
        heart.style.pointerEvents="none";

        const angle=
            Math.random()*Math.PI*2;

        const distance=
            100+Math.random()*300;

        heart.style.setProperty(
            "--x",
            Math.cos(angle)*distance+"px"
        );

        heart.style.setProperty(
            "--y",
            Math.sin(angle)*distance+"px"
        );

        heart.style.animation=
            "heartFly 1.5s ease-out forwards";

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },1600);
    }
}

</script>

</body>
</html>
